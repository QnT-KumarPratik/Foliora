<!DOCTYPE html>  
<html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  
    <title>Library - Foliora</title>  
  
    <link rel="stylesheet" href="library.css">  
</head>  
  
<body>  
    <header class="site-header">  
        <a href="../homepage/index.html" class="logo">Foliora</a>  
  
        <button id="theme-toggle" type="button" aria-label="Toggle theme">  
            🌙  
        </button>  
    </header>  
  
    <main>  
        <section class="library-hero">  
            <p class="eyebrow">Collection</p>  
  
            <h1>Library</h1>  
  
            
                
            <p id="library-status" class="placeholder-text">Loading stories...</p>
            <p id="debug-status" style="white-space: pre-wrap; font-size: 13px;"></p>
                <section class="story-category">
                    <h2>Original Content</h2>
                    <div id="original-list"></div>
                </section>

                <section class="story-category">
                    <h2>Creator Content</h2>
                    <div id="creator-list"></div>
                </section>

  
            <nav class="library-links">  
                <a href="../homepage/index.html">← Back to Home</a>  
            </nav>  
        </section>  
    </main>  
  
    <footer>  
        <p>Foliora</p>  
    </footer>  
  
    <script src="library.js"></script>

</html>
